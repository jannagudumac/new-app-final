spring.application.name=music-wall-backend
server.port=8080

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/music_wall_final}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate creates and updates the tables from the Entity classes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

jwt.secret=${JWT_SECRET:MySimpleSecretKeyForMusicWallApplicationMustBeLongEnough123456}
jwt.expiration=86400000

cors.origin=http://localhost:4200
ticketmaster.api-key=${TICKETMASTER_API_KEY:}
musicbrainz.base-url=https://musicbrainz.org
musicbrainz.user-agent=${MUSICBRAINZ_USER_AGENT:MusicWallStudentProject/1.0 (contact@example.com)}

# Set CATALOG_IMPORT_ENABLED=true only for the first curated import.
# Re-running is safe: MusicBrainz IDs prevent duplicate artists, albums and tracks.
catalog.import.enabled=${CATALOG_IMPORT_ENABLED:false}
catalog.import.exit-after-run=${CATALOG_IMPORT_EXIT_AFTER_RUN:false}
