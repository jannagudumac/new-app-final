<div class="application-layout" [class.sidebar-collapsed]="sidebarCollapsed">
  <app-sidebar
    [collapsed]="sidebarCollapsed"
    (collapseRequested)="toggleSidebar()">
  </app-sidebar>

  <div class="content-shell">
    <header class="topbar">
      <p class="desktop-title">
        <a routerLink="/dashboard">Music Wall</a>
        <b>/</b>
        @if (wallDetailTitle) {
          <a routerLink="/walls">My walls</a>
          <b>/</b>
        }
        <span>{{ pageTitle }}</span>
      </p>
      <a routerLink="/dashboard" class="mobile-title">Music Wall</a>

      <nav class="topbar-actions" aria-label="Quick links">
        <form class="catalog-shortcut" (ngSubmit)="searchCatalogue()">
          <button type="submit" aria-label="Search catalogue">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="m20 20-4-4"></path>
            </svg>
          </button>
          <input
            type="search"
            name="catalogQuery"
            [(ngModel)]="catalogQuery"
            aria-label="Search catalogue"
            placeholder="Search catalogue…">
        </form>
      </nav>
    </header>

    <main class="page-content">
      <router-outlet></router-outlet>
    </main>

    <button
      type="button"
      class="back-to-top"
      [class.visible]="showBackToTop"
      [attr.aria-hidden]="!showBackToTop"
      [tabIndex]="showBackToTop ? 0 : -1"
      aria-label="Back to the top of the page"
      title="Back to top"
      (click)="scrollToTop()">
      <span aria-hidden="true">↑</span>
    </button>
  </div>
</div>
